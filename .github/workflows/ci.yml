name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ matrix.java }}-clj-

      - name: Run tests
        run: clojure -M:test

      - name: Lint (clj-kondo)
        run: clojure -M:lint

      - name: Compile Kotoba round primitives
        run: |
          mkdir -p target/kotoba
          clojure -M:kotoba compile test/sha256d/round_primitives_conformance.kotoba \
            --source-path src --target js-browser --output target/kotoba/round.mjs
          clojure -M:kotoba compile test/sha256d/round_primitives_conformance.kotoba \
            --source-path src --target wasm32-browser --output target/kotoba/round.wasm

      - name: Execute Kotoba Web and Wasm signed-i64 matrix
        run: |
          compiler_src="$(clojure -Spath -M:kotoba | tr ':' '\n' | grep '/compiler/' | head -1)"
          node scripts/verify-kotoba-round-primitives.mjs target/kotoba/round.mjs \
            target/kotoba/round.wasm "$(dirname "$compiler_src")/runtime/browser-host.mjs"

  cljs-portability:
    name: cljs portability proof (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-cljs-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-cljs-

      - name: Compile + run cljs verify
        run: |
          clojure -M:cljs
          node target/cljs-verify.js
